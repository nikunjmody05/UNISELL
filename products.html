<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop: Unisell</title>
<meta name="description" content="Browse electronics, fashion and accessories. Search, filter and sort.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230071e3'/%3E%3Ctext x='50' y='70' font-size='62' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EU%3C/text%3E%3C/svg%3E">
<script src="analytics.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">
<main class="wrap">
  <div class="row"><h1>Shop</h1><span class="sub" id="n"></span></div>
  <div class="bar" role="group" aria-label="Filters">
    <button class="chip on" data-c="all" onclick="setCat('all')">All</button>
    <button class="chip" data-c="electronics" onclick="setCat('electronics')">Electronics</button>
    <button class="chip" data-c="fashion" onclick="setCat('fashion')">Fashion</button>
    <button class="chip" data-c="accessories" onclick="setCat('accessories')">Accessories</button>
    <button class="chip" id="sv" onclick="S.saved=!S.saved;shop()">♥ Saved</button>
    <select aria-label="Sort products" onchange="S.sort=this.value;shop()">
      <option value="f">Featured</option><option value="top">Top rated</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="app.js"></script>
</body>
</html>
