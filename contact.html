<body data-page="contact">
<noscript><p class="empty" style="padding:40px 22px;text-align:center">Unisell needs JavaScript to run. Please enable it and reload.</p></noscript>
<main class="wrap">
  <h1>Contact us</h1>
  <div class="split">
    <form onsubmit="sendMsg(this);return false" novalidate>
      <label for="name">Name</label><input class="f" id="name" name="name" required autocomplete="name">
      <label for="email">Email</label><input class="f" id="email" name="email" type="email" required autocomplete="email">
      <label for="message">Message</label><textarea class="f" id="message" name="message" rows="5" required></textarea>
      <p class="err" id="msg" role="alert"></p><button class="btn" type="submit">Send message</button>
    </form>
    <div><h3>Support</h3><p class="sub">support@unisell.com<br>+91 98765 43210<br>Every day, 9am to 9pm</p><h3 style="margin-top:26px">Office</h3><p class="sub">Unisell Pvt. Ltd.<br>Mumbai, Maharashtra, India</p></div>
  </div>
</main>
